id = "coldneight/lunar_calendar"
name = "农历日历"
version = "1.0.2"
plugin_api = 20
author = "coldneight"
license = "MIT"
icon = "calendar"
description = "农历日历插件：状态栏显示今日农历，点击弹出完整的农历月历（含节气、节日、干支生肖）。"
dependencies = []
tags = ["calendar", "lunar", "chinese", "time", "utility"]

# 面板/状态栏界面语言：auto=跟随系统，zh=中文，en=English
[[setting]]
key = "ui_lang"
type = "select"
label_key = "settings.ui_lang.label"
description_key = "settings.ui_lang.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.ui_lang.options.auto" },
  { value = "zh", label_key = "settings.ui_lang.options.zh" },
  { value = "en", label_key = "settings.ui_lang.options.en" },
]

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "bar_format"
  type = "select"
  label_key = "settings.bar_format.label"
  description_key = "settings.bar_format.description"
  default = "lunar_day"
  options = [
    { value = "lunar_day", label_key = "settings.bar_format.options.lunar_day" },
    { value = "solar_lunar", label_key = "settings.bar_format.options.solar_lunar" },
    { value = "lunar_full", label_key = "settings.bar_format.options.lunar_full" },
  ]

  [[widget.setting]]
  key = "show_glyph"
  type = "bool"
  label_key = "settings.show_glyph.label"
  description_key = "settings.show_glyph.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 360
height = 420
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"
